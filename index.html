<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Firefighters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f2328;
    --muted: #59616b;
    --panel: #fffdf8ee;
    --line: #d9d4c7;
    --fire: #e5532b;
    --ok: #2f8f5b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Rubik", system-ui, sans-serif;
    color: var(--ink);
    background: #26231f;
    overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  .hud {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    width: min(440px, calc(100vw - 20px));
    padding: 10px 12px;
    background: var(--panel);
    border-radius: 10px;
    box-shadow: 0 3px 14px #0006;
    font-size: 13px; line-height: 1.4;
  }
  .title {
    margin: 0 0 8px; font-family: "Press Start 2P", monospace; font-size: 13px;
    color: var(--fire); letter-spacing: 1px;
  }
  .row { display: flex; gap: 6px; align-items: center; }
  .link {
    flex: 1; min-width: 0;
    padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
    font: inherit; color: var(--muted); background: #fff;
  }
  button {
    font: inherit; font-weight: 600;
    padding: 5px 12px; border: 0; border-radius: 6px;
    background: var(--ink); color: #fff; cursor: pointer;
  }
  button:focus-visible, .link:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
  .status { margin-top: 6px; color: var(--muted); }
  .status b { color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .hint { margin-top: 6px; color: var(--muted); font-size: 12px; }

  .overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: #0005;
  }
  .overlay.show { display: flex; }
  .card {
    background: var(--panel); border-radius: 12px; padding: 22px 26px;
    text-align: center; box-shadow: 0 6px 24px #0008; max-width: calc(100vw - 32px);
  }
  .card h2 { margin: 0 0 12px; font-family: "Press Start 2P", monospace; font-size: 16px; line-height: 1.5; }
  .card p { margin: 0 0 16px; color: var(--muted); }
  .win h2 { color: var(--ok); }
  .lose h2 { color: var(--fire); }

  /* ---------- Сенсорне керування ---------- */
  :root { --pad: 150px; --btn: 100px; }
  @media (orientation: landscape) { :root { --pad: 120px; --btn: 84px; } }
  .controls { display: none; }
  .touch .controls { display: block; }
  .touch, .touch body {
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .touch .title, .touch .link, .touch .hint { display: none; }
  .touch .hud {
    top: calc(6px + env(safe-area-inset-top));
    width: auto; max-width: calc(100vw - 12px);
    padding: 6px 10px; font-size: 12px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 12px;
  }
  .touch .status, .touch .legend { margin-top: 0; }
  .touch #copy { padding: 4px 10px; }
  .touch .legend { gap: 2px 10px; justify-content: center; }
  .dpad {
    position: fixed;
    left: calc(14px + env(safe-area-inset-left));
    bottom: calc(14px + env(safe-area-inset-bottom));
    width: var(--pad); height: var(--pad); border-radius: 50%;
    background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.4);
    touch-action: none;
  }
  .dpad svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: rgba(255,255,255,0.75); pointer-events: none; }
  .knob {
    position: absolute; left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50%;
    background: rgba(255,255,255,0.5); pointer-events: none;
  }
  .pour {
    position: fixed;
    right: calc(14px + env(safe-area-inset-right));
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: var(--btn); height: var(--btn); padding: 0; border-radius: 50%;
    background: #2f8fd8e6; border: 3px solid #ffffff99; color: #fff; font-size: 15px;
    touch-action: none;
  }
  .pour.empty { background: #55606be0; }
  .pour.pressed { transform: scale(0.93); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud">
  <h1 class="title">FIREFIGHTERS</h1>
  <div class="row">
    <input class="link" id="link" readonly aria-label="Посилання на гру">
    <button id="copy">Копіювати</button>
  </div>
  <div class="status" id="status">Підключення до кімнати…</div>
  <div class="legend">
    <span><i class="sw" style="background:#4e8a38"></i>Ціла: <b id="nG">0</b></span>
    <span><i class="sw" style="background:#f07a22"></i>Горить: <b id="nF">0</b></span>
    <span><i class="sw" style="background:#8b8b86"></i>Погашена: <b id="nX">0</b></span>
    <span><i class="sw" style="background:#22201d"></i>Згоріла: <b id="nB">0</b></span>
  </div>
  <div class="hint">Стрілки — рух. Біля річки відро наповнюється само. Пробіл — вилити воду на палаючу ділянку, на якій стоїш. Машина збиває на 3 секунди і виливає воду з відра.</div>
</div>

<div class="controls" aria-hidden="true">
  <div class="dpad" id="dpad">
    <svg viewBox="0 0 100 100">
      <path d="M50 9 L61 24 L39 24Z"/>
      <path d="M50 91 L61 76 L39 76Z"/>
      <path d="M9 50 L24 39 L24 61Z"/>
      <path d="M91 50 L76 39 L76 61Z"/>
    </svg>
    <div class="knob" id="knob"></div>
  </div>
  <button class="pour" id="pourBtn">Вилити</button>
</div>

<div class="overlay" id="waitOv">
  <div class="card"><h2>Пошук гравців</h2><p>Підключаємось до кімнати…</p></div>
</div>

<div class="overlay" id="endOv">
  <div class="card" id="endCard">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <button id="restart">Нова гра</button>
  </div>
</div>

<script type="module">
import { joinRoom, selfId } from 'https://esm.run/trystero@0.25.4';

// ================= Налаштування =================
const CELL = 60;                 // розмір ділянки посадки (одиниці світу)
const COLS = 5, ROWS = 10;       // посадка 5 × 10 ділянок
const W = CELL * 15;             // 900: річка 1/6, обочина 1/6, дорога 1/3, посадка 1/3
const H = CELL * ROWS;           // 600
const RIVER_W = W / 6;
const SHOULDER_X = RIVER_W, SHOULDER_W = W / 6;
const ROAD_X = SHOULDER_X + SHOULDER_W, ROAD_W = W / 3;
const FOREST_X = ROAD_X + ROAD_W;
const N = COLS * ROWS;

const SPEED = 300;               // швидкість гравця, одиниць/сек
const BURN_TIME = 40;            // за скільки секунд палаюча ділянка вигорає сама
const SPREAD_RATE = 0.04;        // шанс/сек підпалити кожну сусідню (8 напрямків) цілу ділянку
const START_FIRES = 3;           // скільки ділянок горить на старті
const TICK = 0.25;               // крок симуляції вогню у хоста, сек
const GRACE_MS = 3000;           // очікування інших гравців перед стартом власної гри
const FILL_X = RIVER_W + 22;     // лівіше цієї межі відро наповнюється

// Машини
const CAR_W = W / 12;            // ширина машини (1/12 поля), смуга = 1/6
const CAR_SPEED = 220;           // однакова для всіх машин, одиниць/сек
const CAR_SLOT = 1.8;            // у кожній смузі не частіше ніж одна машина на слот, сек
const CAR_JITTER = 0.4;          // випадковий зсув старту в межах слоту, сек
const CAR_CHANCE = 0.55;         // ймовірність появи машини в слоті
const STUN_MS = 3000;            // скільки гравець стоїть після зіткнення
const STUN_GRACE_MS = 800;       // після оглушення коротко не збивають повторно
const LANES = [
  { x: ROAD_X + ROAD_W / 4, dir: 1 },       // ліва смуга — вниз
  { x: ROAD_X + ROAD_W * 3 / 4, dir: -1 },  // права смуга — вгору
];
const CAR_TYPES = [
  { kind: 'sedan', len: 160 },
  { kind: 'suv', len: 175 },
  { kind: 'truck', len: 250 },
];
const CAR_MAX_LEN = 250;

// Сенсорний пристрій: основний вказівник — палець
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.documentElement.classList.add('touch');
const COPY_LABEL = isTouch ? 'Копіювати посилання' : 'Копіювати';

// ================= Кімната з URL =================
let roomId = location.hash.slice(1);
if (!roomId) {
  roomId = Math.random().toString(36).slice(2, 10);
  history.replaceState(null, '', '#' + roomId);
}
const linkEl = document.getElementById('link');
const copyBtn = document.getElementById('copy');
linkEl.value = location.href;
copyBtn.textContent = COPY_LABEL;
copyBtn.onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); }
  catch { linkEl.select(); document.execCommand('copy'); }
  copyBtn.textContent = 'Скопійовано';
  copyBtn.blur();
  setTimeout(() => copyBtn.textContent = COPY_LABEL, 1500);
};

// ================= Утиліти =================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const safe = (p) => { if (p && p.catch) p.catch(() => {}); };

// сусіди ділянки (8 напрямків)
const NEIGH = [];
for (let i = 0; i < N; i++) {
  const x = i % COLS, y = Math.floor(i / COLS), list = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) list.push(ny * COLS + nx);
  }
  NEIGH.push(list);
}
function cellAt(x, y) {
  if (x < FOREST_X || x >= W || y < 0 || y >= H) return -1;
  return Math.floor(y / CELL) * COLS + Math.floor((x - FOREST_X) / CELL);
}

// ================= Стан =================
const joinedAt = Date.now();
const me = {
  x: SHOULDER_X + 30 + Math.random() * (SHOULDER_W - 60),   // з'являємось на обочині, не на дорозі
  y: 240 + Math.random() * (H - 280),
  hue: Math.floor(Math.random() * 360),
  face: 1, full: false, moving: false,
  stunUntil: 0, graceUntil: 0,
};
// peerId -> { t, x, y, tx, ty, hue, face, full, moving, hasPos }
const peers = new Map();
// grid: 'g' ціла, 'f' горить, 'x' погашена, 'b' згоріла
let game = { round: 0, grid: Array(N).fill('g'), ages: Array(N).fill(0), phase: 'wait' };
let ready = false;
const pending = new Map();                 // локально погашені ділянки, які ще не підтвердив хост
const steamAt = new Float64Array(N);       // час, коли ділянку погасили (для пари)

function getPeer(id) {
  let p = peers.get(id);
  if (!p) {
    p = { t: null, x: W / 2, y: H / 2, tx: W / 2, ty: H / 2, hue: 0, face: 1, full: false, moving: false, stun: false, hasPos: false };
    peers.set(id, p);
  }
  return p;
}

// Хост — учасник, що зайшов найраніше (серед тих, про кого відомо)
function hostId() {
  let bestId = selfId, bestT = joinedAt;
  for (const [id, p] of peers) {
    if (p.t == null) continue;
    if (p.t < bestT || (p.t === bestT && id < bestId)) { bestId = id; bestT = p.t; }
  }
  return bestId;
}
const amHost = () => hostId() === selfId;

// Спільний час (годинник хоста) — від нього детерміновано рахуються машини
let clockOffset = 0, clockFrom = null;
const clockSamples = [];
function sampleClock(ht, from) {
  if (from !== clockFrom) { clockFrom = from; clockSamples.length = 0; }
  clockSamples.push(ht - Date.now());          // = зсув - затримка, тому беремо максимум
  if (clockSamples.length > 12) clockSamples.shift();
  clockOffset = Math.max(...clockSamples);
}
const sharedNow = () => Date.now() + (amHost() ? 0 : clockOffset);

// ================= P2P =================
const room = joinRoom({ appId: 'yurii-firefighters-v1' }, roomId);
const helloA = room.makeAction('hello');
const posA = room.makeAction('pos');
const worldA = room.makeAction('world');
const douseA = room.makeAction('douse');
const restartA = room.makeAction('restart');

const myPos = () => ({
  x: Math.round(me.x), y: Math.round(me.y), h: me.hue,
  f: me.face, b: me.full ? 1 : 0, m: me.moving ? 1 : 0,
  s: performance.now() < me.stunUntil ? 1 : 0,
});
const worldMsg = () => ({
  r: game.round, g: game.grid.join(''),
  a: game.ages.map(v => Math.round(v * 10) / 10), p: game.phase,
  ht: Date.now(),
});
function sendWorld(target) {
  if (!game.round) return;
  safe(worldA.send(worldMsg(), target ? { target } : undefined));
}

room.onPeerJoin = (id) => {
  getPeer(id);
  safe(helloA.send({ t: joinedAt }, { target: id }));
  safe(posA.send(myPos(), { target: id }));
  if (amHost()) sendWorld(id);
  updateHud();
};
room.onPeerLeave = (id) => {
  peers.delete(id);
  updateHud();
};

helloA.onMessage = (d, { peerId }) => {
  getPeer(peerId).t = d.t;
  updateHud();
};

posA.onMessage = (d, { peerId }) => {
  const p = getPeer(peerId);
  if (!p.hasPos) { p.x = d.x; p.y = d.y; p.hasPos = true; }
  p.tx = d.x; p.ty = d.y; p.hue = d.h; p.face = d.f; p.full = !!d.b; p.moving = !!d.m; p.stun = !!d.s;
};

worldA.onMessage = (d, { peerId }) => {
  if (peerId !== hostId() && game.round) return;   // стан приймаємо тільки від хоста
  ready = true;
  if (d.ht) sampleClock(d.ht, peerId);
  const grid = d.g.split('');
  if (d.r === game.round) {
    const now = performance.now();
    for (const [i, t0] of pending) {
      if (now - t0 > 1500) pending.delete(i);
      else if (grid[i] === 'f') grid[i] = 'x';
    }
  } else {
    pending.clear();
  }
  applyGrid(grid);
  game.round = d.r;
  game.ages = d.a.slice();
  game.phase = d.p;
  updateHud();
};

douseA.onMessage = (d, { peerId }) => {
  if (!amHost() || d.r !== game.round || game.phase !== 'play') return;
  if (game.grid[d.i] === 'f') {
    game.grid[d.i] = 'x';
    steamAt[d.i] = performance.now();
    checkEnd();
    sendWorld();
    updateHud();
  }
};

restartA.onMessage = (d) => {
  if (amHost() && d.r === game.round && game.phase !== 'play') newRound();
};

function applyGrid(grid) {
  const now = performance.now();
  for (let i = 0; i < N; i++) {
    if (game.grid[i] === 'f' && grid[i] === 'x') steamAt[i] = now;
  }
  game.grid = grid;
}

// ================= Логіка вогню (тільки хост) =================
function newRound() {
  const g = Array(N).fill('g'), a = Array(N).fill(0);
  const sy = 2 + Math.floor(Math.random() * (ROWS - 4));
  const sx = Math.floor(Math.random() * COLS);
  g[sy * COLS + sx] = 'f';
  let lit = 1, guard = 0;
  while (lit < START_FIRES && guard++ < 200) {
    const burning = [];
    for (let i = 0; i < N; i++) if (g[i] === 'f') burning.push(i);
    const b = burning[Math.floor(Math.random() * burning.length)];
    const n = NEIGH[b][Math.floor(Math.random() * NEIGH[b].length)];
    if (g[n] === 'g') { g[n] = 'f'; a[n] = Math.random() * 3; lit++; }
  }
  game = { round: Math.max(Date.now(), game.round + 1), grid: g, ages: a, phase: 'play' };
  pending.clear();
  steamAt.fill(0);
  sendWorld();
  updateHud();
}

function checkEnd() {
  if (game.phase !== 'play') return;
  if (game.grid.includes('f')) return;
  game.phase = game.grid.includes('g') ? 'win' : 'lose';
}

function hostTick(dt) {
  const g = game.grid, a = game.ages, ignite = [];
  let changed = false;
  for (let i = 0; i < N; i++) {
    if (g[i] !== 'f') continue;
    a[i] += dt;
    for (const n of NEIGH[i]) {
      if (g[n] === 'g' && Math.random() < SPREAD_RATE * dt) ignite.push(n);
    }
  }
  for (let i = 0; i < N; i++) {
    if (g[i] === 'f' && a[i] >= BURN_TIME) { g[i] = 'b'; changed = true; }
  }
  for (const n of ignite) {
    if (g[n] === 'g') { g[n] = 'f'; a[n] = 0; changed = true; }
  }
  checkEnd();
  return changed || game.phase !== 'play';
}

let tickCount = 0;
setInterval(() => {
  tickCount++;
  if (!amHost()) return;
  if (!game.round) {
    if (ready) newRound();
    return;
  }
  let changed = false;
  if (game.phase === 'play') changed = hostTick(TICK);
  if (changed || tickCount % 4 === 0) sendWorld();   // зміни — одразу, інакше раз на секунду
  if (changed) updateHud();
}, TICK * 1000);

setTimeout(() => { ready = true; updateHud(); }, GRACE_MS);

// Розсилка власної позиції
let lastPos = '', lastPosT = 0;
setInterval(() => {
  if (!peers.size) return;
  const p = myPos(), s = JSON.stringify(p), now = performance.now();
  if (s !== lastPos || now - lastPosT > 1000) {
    lastPos = s; lastPosT = now;
    safe(posA.send(p));
  }
}, 50);

// ================= Ввід =================
const keys = new Set();
const ARROWS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
addEventListener('keydown', (e) => {
  if (ARROWS.includes(e.key)) { keys.add(e.key); e.preventDefault(); }
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) pour(); }
});
addEventListener('keyup', (e) => keys.delete(e.key));

// Сенсорні контроли додають "натиснуті стрілки" в окремий набір
const touchKeys = new Set();
const held = (k) => keys.has(k) || touchKeys.has(k);
addEventListener('blur', () => { keys.clear(); touchKeys.clear(); });

const pourBtn = document.getElementById('pourBtn');
let pourEmpty = null;
if (isTouch) {
  const dpad = document.getElementById('dpad'), knob = document.getElementById('knob');
  // 8 секторів за кутом від центру: 0 — вправо, далі за годинниковою стрілкою
  const DIRS = [
    ['ArrowRight'], ['ArrowRight', 'ArrowDown'], ['ArrowDown'], ['ArrowLeft', 'ArrowDown'],
    ['ArrowLeft'], ['ArrowLeft', 'ArrowUp'], ['ArrowUp'], ['ArrowRight', 'ArrowUp'],
  ];
  let padId = null;
  const padUpdate = (e) => {
    const r = dpad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const rad = r.width / 2, len = Math.hypot(dx, dy);
    const shift = Math.min(1, len / rad) * rad * 0.45;
    knob.style.transform = len ? `translate(${dx / len * shift}px, ${dy / len * shift}px)` : '';
    touchKeys.clear();
    if (len < rad * 0.18) return;                        // мертва зона в центрі
    const sector = (Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8;
    for (const k of DIRS[sector]) touchKeys.add(k);
  };
  const padEnd = (e) => {
    if (e.pointerId !== padId) return;
    padId = null;
    touchKeys.clear();
    knob.style.transform = '';
  };
  dpad.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    padId = e.pointerId;
    dpad.setPointerCapture(e.pointerId);
    padUpdate(e);
  });
  dpad.addEventListener('pointermove', (e) => { if (e.pointerId === padId) padUpdate(e); });
  dpad.addEventListener('pointerup', padEnd);
  dpad.addEventListener('pointercancel', padEnd);
  dpad.addEventListener('lostpointercapture', padEnd);

  const unpress = () => pourBtn.classList.remove('pressed');
  pourBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    pourBtn.classList.add('pressed');
    pour();
  });
  pourBtn.addEventListener('pointerup', unpress);
  pourBtn.addEventListener('pointercancel', unpress);
  pourBtn.addEventListener('pointerleave', unpress);

function pour() {
  if (!me.full || game.phase !== 'play' || performance.now() < me.stunUntil) return;
  const i = cellAt(me.x, me.y - 4);
  if (i < 0 || game.grid[i] !== 'f') return;
  me.full = false;
  game.grid[i] = 'x';
  steamAt[i] = performance.now();
  if (amHost()) {
    checkEnd();
    sendWorld();
  } else {
    pending.set(i, performance.now());
    safe(douseA.send({ r: game.round, i }, { target: hostId() }));
  }
  updateHud();
}

const BG = 2; // роздільна здатність пререндеру
function buildBackground() {
  const c = makeCanvas(W * BG, H * BG), g = c.getContext('2d');
  g.scale(BG, BG);
  const rnd = mulberry32(7);

  // обочина: ґрунт із гравієм
  g.fillStyle = '#9a8a6c';
  g.fillRect(SHOULDER_X, 0, SHOULDER_W, H);
  for (let i = 0; i < 6000; i++) {
    const x = SHOULDER_X + rnd() * SHOULDER_W, y = rnd() * H, s = 0.6 + rnd() * 1.8;
    g.fillStyle = rnd() < 0.5 ? `rgba(70,58,40,${0.2 + rnd() * 0.3})` : `rgba(215,205,180,${0.2 + rnd() * 0.35})`;
    g.fillRect(x, y, s, s);
  }
  // берег
  g.fillStyle = '#6f6149';
  g.fillRect(SHOULDER_X, 0, 5, H);

  // асфальт
  g.fillStyle = '#343434';
  g.fillRect(ROAD_X, 0, ROAD_W, H);
  for (let i = 0; i < 16000; i++) {
    const x = ROAD_X + rnd() * ROAD_W, y = rnd() * H, s = 0.5 + rnd() * 1.4;
    const l = rnd() < 0.6 ? 18 + rnd() * 30 : 110 + rnd() * 120;
    g.fillStyle = `rgba(${l},${l},${l},${0.35 + rnd() * 0.5})`;
    g.fillRect(x, y, s, s);
  }
  // пунктирна розмітка
  const DASH = 70, GAP = 45, LW = 14, cx = ROAD_X + ROAD_W / 2, OFF = 20;
  g.fillStyle = '#eeeeee';
  for (let y = -OFF; y < H; y += DASH + GAP) g.fillRect(cx - LW / 2, y, LW, DASH);
  for (let i = 0; i < 900; i++) {
    const x = cx - LW / 2 + rnd() * LW, y = rnd() * H;
    if (((y + OFF) % (DASH + GAP)) >= DASH) continue;
    const l = 150 + rnd() * 80;
    g.fillStyle = `rgba(${l},${l},${l},0.7)`;
    g.fillRect(x, y, 0.6 + rnd(), 0.6 + rnd());
  }
  // тінь краю дороги
  g.fillStyle = 'rgba(0,0,0,0.18)';
  g.fillRect(ROAD_X, 0, 3, H);
  g.fillRect(ROAD_X + ROAD_W - 3, 0, 3, H);
  return c;
}

const TILE_PAL = {
  g: { ground: '#4e8a38', lite: '#63a34a', dark: '#3b6e2b', tree: '#2e6428', treeLite: '#43903a' },
  f: { ground: '#5b4a2c', lite: '#6e5a34', dark: '#43361f', tree: '#3a3219', treeLite: '#4d4222' },
  x: { ground: '#8b8b86', lite: '#a09f9a', dark: '#74746e', tree: '#66665f', treeLite: '#7d7d76' },
  b: { ground: '#22201d', lite: '#302d29', dark: '#141210', tree: '#0d0c0b', treeLite: '#1b1917' },
};
function buildTile(idx, state) {
  const c = makeCanvas(CELL * BG, CELL * BG), g = c.getContext('2d');
  g.scale(BG, BG);
  const p = TILE_PAL[state];
  g.fillStyle = p.ground;
  g.fillRect(0, 0, CELL, CELL);
  const r1 = mulberry32(idx * 31 + 1);
  for (let i = 0; i < 160; i++) {
    const x = r1() * CELL, y = r1() * CELL;
    g.fillStyle = r1() < 0.5 ? p.lite : p.dark;
    g.fillRect(x, y, 1.2, 2.2);
  }
  const r2 = mulberry32(idx * 97 + 5);
  const n = 2 + Math.floor(r2() * 2);
  for (let k = 0; k < n; k++) {
    const tx = 13 + r2() * 34, ty = 13 + r2() * 34, r = 9 + r2() * 6;
    if (state === 'b') {
      g.fillStyle = p.tree;
      g.beginPath(); g.arc(tx, ty, r * 0.35, 0, Math.PI * 2); g.fill();
      g.strokeStyle = p.lite; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(tx - r * 0.8, ty + r * 0.2); g.lineTo(tx + r * 0.6, ty - r * 0.3); g.stroke();
      continue;
    }
    g.fillStyle = 'rgba(0,0,0,0.25)';
    g.beginPath(); g.arc(tx + 3, ty + 4, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = p.tree;
    for (const [ox, oy, s] of [[0, 0, 1], [-r * 0.45, r * 0.25, 0.7], [r * 0.45, r * 0.2, 0.7]]) {
      g.beginPath(); g.arc(tx + ox, ty + oy, r * s, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = p.treeLite;
    g.beginPath(); g.arc(tx - r * 0.3, ty - r * 0.3, r * 0.45, 0, Math.PI * 2); g.fill();
  }
  g.strokeStyle = 'rgba(0,0,0,0.14)';
  g.lineWidth = 1;
  g.strokeRect(0.5, 0.5, CELL - 1, CELL - 1);
  return c;
}

function flameShape(x, y, w, h, sway, color) {

function drawFire(i, age, t) {
  const cx = FOREST_X + (i % COLS) * CELL, cy = Math.floor(i / COLS) * CELL;
  let k = Math.min(1, 0.45 + age / 4);

  const gr = ctx.createRadialGradient(cx + 30, cy + 32, 4, cx + 30, cy + 32, 48);
  gr.addColorStop(0, `rgba(255,150,40,${0.5 * k})`);
  gr.addColorStop(1, 'rgba(255,80,20,0)');

  ctx.fillRect(cx - 18, cy - 18, CELL + 36, CELL + 36);

  for (const f of flames[i]) {

    const h = (22 + 16 * f.s) * k * flick, w = h * 0.6;
    const sw = Math.sin(t * 5 + f.ph) * 2.5;
    const x = cx + f.x, y = cy + f.y;
    flameShape(x, y, w, h, sw, '#d8341c');

    ctx.fillRect(x + Math.sin(t * 3 + f.ph) * 5, y - h - p * 22, 2, 2);

}
function drawSteam(i, now) {

const PX = 3; // розмір "пікселя" спрайта в одиницях світу
const BODY = [
  '.....hHHHh......',
  '....hHHHHHh.....',
  '....HHHHHHHH....',
  '..hhhhhhhhhhh...',
  '.....SSSSSS.....',
  '.....SSSSES.....',
  '.....SSSSSSS....',
  '......SSSS......',
  '....JJJJJJJ.....',
  '...JJJJJJJJJ....',
  '...JYYYYYYYJ....',
  '...JJJJJJJJJJ...',
  '...JJJJJJJJJGG..',
  '...YYYYYYYYY....',
];
const LEGS = [
  ['....PPP.PPP.....',
   '....PPP.PPP.....',
   '....PPP.PPP.....',
   '...BBBB.BBBB....'],
  ['....PPP..PPP....',
   '...PPP....PPP...',
   '..PPP......PPP..',
   '.BBBB......BBBB.'],
];
const BUCKET = ['..k..', '.k.k.', 'WwWWW', 'MMMMM', '.MMM.', '.MMM.'];
const SPR_W = 16, SPR_H = 18;
const spriteCache = new Map();
function sprite(hue, frame, full) {
  const key = `${hue}|${frame}|${full}`;
  let c = spriteCache.get(key);
  if (c) return c;
  const pal = {
    H: `hsl(${hue} 75% 50%)`, h: `hsl(${hue} 75% 34%)`,
    S: '#f2c28b', E: '#1b1b1b', J: '#c2913f', Y: '#f4e04d',
    P: '#8c6a2f', B: '#2b2b2b', G: '#3a3a3a', M: '#9aa3ad', k: '#5f6770',
    W: full ? '#3aa6f0' : '#2a2f36', w: full ? '#a8dcff' : '#2a2f36',
  };
  c = makeCanvas(SPR_W * PX, SPR_H * PX);
  const g = c.getContext('2d');
  const put = (col, row, ch) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(col * PX, row * PX, PX, PX); } };
  const rows = BODY.concat(LEGS[frame]);
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== 'G') put(x, y, ch); }));
  BUCKET.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') put(11 + x, 12 + y, ch); }));
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === 'G') put(x, y, ch); }));
  spriteCache.set(key, c);
  return c;
}
function drawPlayer(x, y, hue, face, full, moving, mine, stun, t) {
  const frame = moving && Math.floor(t * 7) % 2 ? 1 : 0;
  ctx.globalAlpha = stun && Math.floor(t * 8) % 2 ? 0.2 : 1;
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(x, y, 17, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(face, 1);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sprite(hue, frame, full), -SPR_W * PX / 2, -SPR_H * PX);
  ctx.restore();
  if (mine) {
    const ty = y - SPR_H * PX - 8;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1f2328';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 7, ty - 8); ctx.lineTo(x + 7, ty - 8); ctx.lineTo(x, ty); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ================= Машини =================
// Розклад машин детермінований: залежить лише від кімнати та спільного часу,
// тому в усіх гравців машини однакові без жодної передачі даних.
const roadSeed = hashStr(roomId);
function carsAt(T) {
  const out = [];
  const travel = (H + 2 * CAR_MAX_LEN) / CAR_SPEED;
  for (let li = 0; li < LANES.length; li++) {
    const lane = LANES[li];
    const kMin = Math.floor((T - travel) / CAR_SLOT) - 1, kMax = Math.floor(T / CAR_SLOT);
    for (let k = kMin; k <= kMax; k++) {
      const r = mulberry32((roadSeed ^ Math.imul(li + 1, 0x9E3779B1) ^ Math.imul(k, 0x85EBCA77)) >>> 0);
      if (r() > CAR_CHANCE) continue;
      const t0 = k * CAR_SLOT + r() * CAR_JITTER;
      if (t0 > T) continue;
      const tv = r();
      const type = CAR_TYPES[tv < 0.45 ? 0 : tv < 0.8 ? 1 : 2];
      const hue = Math.floor(r() * 360), sat = 50 + r() * 30, lig = 36 + r() * 22;
      const d = (T - t0) * CAR_SPEED;                 // пройдений шлях передньою частиною
      let y1, y2;
      if (lane.dir > 0) { y2 = d; y1 = d - type.len; } // їде вниз, стартує над полем
      else { y1 = H - d; y2 = y1 + type.len; }        // їде вгору, стартує під полем
      if (y2 < 0 || y1 > H) continue;
      out.push({ x: lane.x, y1, y2, dir: lane.dir, kind: type.kind, len: type.len, hue, sat, lig });
    }
  }
  return out;
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// Машина малюється передом вниз (+y), для руху вгору розвертається на 180°
function drawCar(c) {
  const hw = CAR_W / 2, hl = c.len / 2;
  const body = `hsl(${c.hue} ${c.sat}% ${c.lig}%)`;
  const dark = `hsl(${c.hue} ${c.sat}% ${c.lig - 14}%)`;
  const lite = `hsl(${c.hue} ${c.sat}% ${Math.min(80, c.lig + 14)}%)`;
  const glass = '#26323f';
  ctx.save();
  ctx.translate(c.x, (c.y1 + c.y2) / 2);
  if (c.dir < 0) ctx.rotate(Math.PI);

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  rr(-hw + 5, -hl + 7, CAR_W, c.len, 14); ctx.fill();

  // дзеркала
  ctx.fillStyle = dark;
  const mirY = c.kind === 'truck' ? hl - 52 : hl - 62;
  ctx.fillRect(-hw - 6, mirY, 7, 9);
  ctx.fillRect(hw - 1, mirY, 7, 9);

  if (c.kind === 'truck') {
    // кузов-фургон
    ctx.fillStyle = `hsl(${c.hue} 12% 86%)`;
    rr(-hw, -hl, CAR_W, c.len - 78, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
    for (let y = -hl + 30; y < hl - 90; y += 30) { ctx.beginPath(); ctx.moveTo(-hw + 6, y); ctx.lineTo(hw - 6, y); ctx.stroke(); }
    // кабіна
    ctx.fillStyle = body;
    rr(-hw + 2, hl - 74, CAR_W - 4, 74, 14); ctx.fill();
    ctx.fillStyle = glass;
    rr(-hw + 9, hl - 30, CAR_W - 18, 16, 4); ctx.fill();
    ctx.fillStyle = lite;
    rr(-hw + 10, hl - 66, CAR_W - 20, 32, 5); ctx.fill();
  } else {
    const suv = c.kind === 'suv';
    ctx.fillStyle = body;
    rr(-hw, -hl, CAR_W, c.len, suv ? 12 : 18); ctx.fill();
    ctx.fillStyle = dark;
    ctx.fillRect(-hw + 4, hl - 40, CAR_W - 8, 2);        // лінія капота
    ctx.fillRect(-hw + 4, -hl + 26, CAR_W - 8, 2);       // лінія багажника
    // лобове скло
    ctx.fillStyle = glass;
    ctx.beginPath();
    ctx.moveTo(-hw + 8, hl - 44); ctx.lineTo(hw - 8, hl - 44);
    ctx.lineTo(hw - 13, hl - 70); ctx.lineTo(-hw + 13, hl - 70); ctx.closePath(); ctx.fill();
    // заднє скло
    const rear = suv ? -hl + 20 : -hl + 32;
    ctx.beginPath();
    ctx.moveTo(-hw + 10, rear); ctx.lineTo(hw - 10, rear);
    ctx.lineTo(hw - 13, rear + 18); ctx.lineTo(-hw + 13, rear + 18); ctx.closePath(); ctx.fill();
    // дах
    ctx.fillStyle = lite;
    rr(-hw + 12, rear + 20, CAR_W - 24, (hl - 72) - (rear + 20), 6); ctx.fill();
    if (suv) {
      ctx.fillStyle = dark;
      ctx.fillRect(-hw + 14, rear + 24, 3, (hl - 78) - (rear + 24));
      ctx.fillRect(hw - 17, rear + 24, 3, (hl - 78) - (rear + 24));
    }
  }
  // фари і стопи
  ctx.fillStyle = '#fff4c2';
  ctx.fillRect(-hw + 6, hl - 6, 14, 5);
  ctx.fillRect(hw - 20, hl - 6, 14, 5);
  ctx.fillStyle = '#d42a2a';
  ctx.fillRect(-hw + 6, -hl + 1, 12, 4);
  ctx.fillRect(hw - 18, -hl + 1, 12, 4);
  ctx.restore();
}

// Зіткнення: "ноги" гравця з прямокутником машини
function hitByCar(cars) {
  for (const c of cars) {
    if (Math.abs(me.x - c.x) < CAR_W / 2 + 10 && me.y > c.y1 + 6 && me.y - 16 < c.y2 - 6) return true;
  }
  return false;
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0;
const hudEl = document.getElementById('hud');
const dpadEl = document.getElementById('dpad');
function resize() {
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  // На телефоні поле не ховається під HUD, а в портретній орієнтації — і під контроли
  let top = 0, bottom = 0;
  if (isTouch) {
    top = hudEl.getBoundingClientRect().bottom + 6;
    if (innerHeight > innerWidth) bottom = dpadEl.offsetHeight + 28;
  }
  const availH = cv.height - (top + bottom) * dpr;
  scale = Math.min(cv.width / W, availH / H);
  offX = (cv.width - W * scale) / 2;
  offY = top * dpr + (availH - H * scale) / 2;
}

let prev = performance.now();
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.1);
  prev = now;
  const t = now / 1000;

  // рух
  let dx = 0, dy = 0;
  if (held('ArrowLeft')) dx -= 1;
  if (held('ArrowRight')) dx += 1;
  if (held('ArrowUp')) dy -= 1;
  if (held('ArrowDown')) dy += 1;
  if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
  const stunned = now < me.stunUntil;
  if (stunned) { dx = 0; dy = 0; }
  me.moving = !!(dx || dy);
  if (dx) me.face = dx > 0 ? 1 : -1;
  me.x = Math.max(RIVER_W + 10, Math.min(W - 16, me.x + dx * SPEED * dt));
  me.y = Math.max(40, Math.min(H - 4, me.y + dy * SPEED * dt));
  if (me.x <= FILL_X) me.full = true;

  const cars = carsAt(sharedNow() / 1000);
  if (!stunned && now >= me.graceUntil && game.round && hitByCar(cars)) {
    me.stunUntil = now + STUN_MS;
    me.graceUntil = me.stunUntil + STUN_GRACE_MS;
    me.full = false;
    me.moving = false;
  }

  if (isTouch) {
    const empty = !me.full || now < me.stunUntil;
    if (empty !== pourEmpty) { pourEmpty = empty; pourBtn.classList.toggle('empty', empty); }
  }

  // локальне старіння вогню для анімації (у хоста це робить симуляція)
  if (!amHost() && game.phase === 'play') {
    for (let i = 0; i < N; i++) if (game.grid[i] === 'f') game.ages[i] += dt;
  }

  // згладжування чужих позицій
  const k = 1 - Math.pow(0.001, dt);
  for (const p of peers.values()) { p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k; }

  // --- малювання ---
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#26231f';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  ctx.imageSmoothingEnabled = true;
  drawRiver(t);
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  for (let i = 0; i < N; i++) {
    ctx.drawImage(tiles[i][game.grid[i]], FOREST_X + (i % COLS) * CELL, Math.floor(i / COLS) * CELL, CELL, CELL);
  }

  for (const c of cars) drawCar(c);

  // підсвітка ділянки, яку можна загасити
  const ci = cellAt(me.x, me.y - 4);
  if (me.full && ci >= 0 && game.grid[ci] === 'f' && game.phase === 'play') {
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(FOREST_X + (ci % COLS) * CELL + 2, Math.floor(ci / COLS) * CELL + 2, CELL - 4, CELL - 4);
    ctx.setLineDash([]);
  }

  for (let i = 0; i < N; i++) if (game.grid[i] === 'f') drawFire(i, game.ages[i], t);
  for (let i = 0; i < N; i++) if (steamAt[i]) drawSteam(i, now);

  // гравці, відсортовані по y
  const list = [];
  for (const p of peers.values()) if (p.hasPos) list.push({ x: p.x, y: p.y, hue: p.hue, face: p.face, full: p.full, moving: p.moving, stun: p.stun, mine: false });
  list.push({ x: me.x, y: me.y, hue: me.hue, face: me.face, full: me.full, moving: me.moving, stun: now < me.stunUntil, mine: true });
  list.sort((a, b) => a.y - b.y);
  for (const p of list) drawPlayer(p.x, p.y, p.hue, p.face, p.full, p.moving, p.mine, p.stun, t);

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('beforeunload', () => room.leave());
</script>
</body>
</html>
